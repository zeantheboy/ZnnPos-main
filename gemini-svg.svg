<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 150" width="450" height="150">
  <!-- Optional transparent or solid background -->
  <rect width="450" height="150" fill="#ffffff" rx="15"/>
  
  <!-- Icon: POS Terminal + Lightning/Speed Concept -->
  <g transform="translate(30, 25)">
    <!-- Terminal Body -->
    <rect x="0" y="20" width="75" height="55" rx="10" fill="#4F46E5"/>
    <!-- Terminal Screen -->
    <rect x="10" y="30" width="55" height="20" rx="4" fill="#E0E7FF"/>
    <!-- Speed/Lightning Element -->
    <path d="M 50 0 L 25 50 L 40 50 L 15 100 L 70 40 L 50 40 Z" fill="#10B981" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>
  
  <!-- Logo Text -->
  <text x="130" y="90" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="900" fill="#111827">
    Swift<tspan fill="#4F46E5">POS</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="135" y="115" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7280" letter-spacing="3">
    SEAMLESS TRANSACTIONS
  </text>
</svg>
